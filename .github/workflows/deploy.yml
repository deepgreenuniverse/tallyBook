name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, test]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Expo Web
        run: cd client && npx expo export --platform web

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          npm install -g wrangler
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          wrangler pages deploy client/dist --project-name=tallybook --branch=$BRANCH 2>&1 | tee /tmp/deploy.log
          URL=$(grep -oP 'https://[a-z0-9]+\.tallybook\.pages\.dev' /tmp/deploy.log || echo "not-found")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "## Preview URL" >> $GITHUB_STEP_SUMMARY
          echo "$URL" >> $GITHUB_STEP_SUMMARY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload preview URL
        run: echo "${{ steps.deploy.outputs.url }}" > preview-url.txt

      - name: Upload URL as artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-url
          path: preview-url.txt